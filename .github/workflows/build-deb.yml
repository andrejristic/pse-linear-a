# Builds the self-contained .deb on Ubuntu 22.04 (runs on Ubuntu 22.04+ / Debian 12+),
# installs it, and checks the app starts headless.
name: build-deb

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e . pyinstaller
      - name: Build .deb
        run: bash packaging/build_deb.sh
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ./dist/pse-linear-a_*_amd64.deb
      - name: App starts (headless)
        run: |
          sudo apt-get install -y xvfb libxcb-cursor0
          export QT_QPA_PLATFORM=offscreen
          timeout 25 xvfb-run -a pse-linear-a &
          pid=$!
          sleep 18
          kill -0 $pid && echo "running" || { echo "exited early"; exit 1; }
          kill $pid 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: pse-linear-a-deb
          path: dist/*.deb
