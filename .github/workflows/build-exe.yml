# Builds the Windows installer on GitHub's Windows runner, installs it silently,
# and checks the app starts.
name: build-exe

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/Scripts/pip install -e . pyinstaller
      - name: Inno Setup
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup --no-progress -y; fi
      - name: Build installer
        run: bash packaging/build_exe.sh
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\PSELinearA-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:RUNNER_TEMP\la" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\la\pse-linear-a.exe")) { throw "not installed" }
      - name: App starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process "$env:RUNNER_TEMP\la\pse-linear-a.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "pse-linear-a exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pse-linear-a-exe
          path: dist/*.exe
